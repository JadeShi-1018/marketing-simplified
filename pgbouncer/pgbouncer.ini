;; PgBouncer configuration for marketing-simplified
;; Transaction pooling mode: connections are returned to the pool after each
;; transaction, which is safe with Django's default CONN_MAX_AGE=0.

[databases]
;; Forward all connections to the upstream PostgreSQL server.
;; Override host/port via the DB_HOST and DB_PORT environment variables
;; passed to the PgBouncer container in docker-compose.
* = host=host.docker.internal port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; Transaction pooling: the connection is released back to the pool at
;; transaction end.  This is the only mode compatible with Django's ORM
;; which relies on SET search_path inside transactions.
pool_mode = transaction

;; Auth — use the userlist.txt mounted alongside this file.
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Pool sizing
;; default_pool_size: max server connections per user/database pair.
;; PostgreSQL max_connections is set to 200 to accommodate this plus
;; direct admin/migration connections.
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Client limits — allow many Django/Celery threads to queue for a
;; pooled server connection.
max_client_conn = 300

;; Timeouts
server_idle_timeout = 300
server_lifetime = 3600
client_idle_timeout = 0
client_login_timeout = 60
query_timeout = 0
query_wait_timeout = 120

;; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

;; Admin access for monitoring (SHOW POOLS, SHOW STATS, etc.)
admin_users = mediajira_user
stats_users = mediajira_user

;; Ignore extra startup parameters that Django sends
ignore_startup_parameters = extra_float_digits,options

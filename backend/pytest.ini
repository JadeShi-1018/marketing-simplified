[pytest]
python_files = tests.py test_*.py tests_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=budget_approval
    --cov=retrospective
    --cov=campaign
    --cov=client_communication
    --cov=meetings
    --cov-report=html:htmlcov
    --cov-report=json:coverage.json
    --cov-report=term-missing
    --cov-fail-under=85
    --durations=10
    --maxfail=5
    --disable-warnings
    --ds=backend.settings
    --ignore=metric_upload/tests/integration
    --ignore=asset/tests/test_tasks.py
    -n auto
    --dist loadscope
    --timeout=300
markers =
    unit: Unit tests
    integration: Integration tests
    concurrency: Concurrency tests
    escalation: Escalation tests
    permissions: Permission tests
    slow: Slow running tests
    api: API tests
    models: Model tests
    services: Service tests
    views: View tests
    asyncio: Async tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
testpaths =
    budget_approval/tests
    core/tests
    access_control/tests
    retrospective/tests
    campaign/tests
    client_communication/tests
    comments/tests
    decision/tests
    calendars/tests
    meetings/tests
    behavioral_tracking/tests
    experience_group/tests
    customer/tests
    experience_group/tests
    csm/tests
asyncio_mode = auto
